<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link
    rel="stylesheet"
    href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
    integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU"
    crossorigin="anonymous"
  />
  <!-- Your custom CSS here -->
  <title>Weather Dashboard</title>
</head>
<body>
  <header
    class="container-fluid text-center text-white bg-dark p-1 weather-header"
  >
    <h1>Weather Dashboard</h1>
  </header>

  <div class="container-fluid" style="max-width: 1400px">
    <div class="row">
      <aside class="col-lg-3 pb-3">
        <h2 id="form-heading" class="mt-1 h3 form-label">
          Search for a City:
        </h2>
        <form id="search-form" class="form">
          <div class="form-group form-inline">
            <div class="input-group">
              <input
                id="city-input"
                type="text"
                class="form-control weather-search"
                placeholder="San Diego"
                aria-labelledby="form-heading"
                aria-controls="current-weather forecast-container"
              />
              <div class="input-group-append">
                <button
                  id="search-button"
                  type="submit"
                  class="btn btn-primary search-button"
                  aria-label="submit search"
                >
                  Search
                </button>
              </div>
            </div>
          </div>
        </form>

        <div id="history" class="list-group row mt-2"></div>
      </aside>

      <main class="col-lg-9 pb-3">
        <section class="mt-3" role="region" aria-live="polite">
          <div id="current-weather" class="card">
            <div class="card-body">
              <h2 id="search-title" class="card-title">
                Search for a city!
                <img id="weather-img" class="weather-img" alt="" />
              </h2>
              <p id="temp" class="card-text">Temperature: °F</p>
              <p id="wind" class="card-text">Wind: MPH</p>
              <p id="humidity" class="card-text">Humidity: %</p>
            </div>
          </div>
        </section>

        <section
          id="forecast-container"
          class="row mt-3"
          role="region"
          aria-live="polite"
        ></section>
      </main>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
